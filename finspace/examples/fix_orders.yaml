name: fix-new-order-single
version: "1"
description: Bounded FIX 4.4 New Order Single test profile.
metadata:
  protocol: FIX.4.4
fields:
  - name: message_type
    values: [D]
  - name: side
    values: ["1", "2"]
  - name: order_type
    values: ["1", "2", "3", "4"]
  - name: symbol
    values: [AAPL, MSFT, NVDA, TSLA, EUR/USD, USD/INR]
  - name: quantity
    values: [100, 500, 1000, 5000]
  - name: price
    values: [50.0, 75.0, 100.0, 125.0, 150.0]
    when:
      order_type: ["2", "4"]
  - name: stop_price
    values: [45.0, 70.0, 95.0, 120.0, 145.0]
    when:
      order_type: ["3", "4"]
  - name: time_in_force
    values: ["0", "1", "3", "4", "6"]
