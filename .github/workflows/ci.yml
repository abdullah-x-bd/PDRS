name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit and exhaustive tests
        run: PYTHONPATH=src python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          test "$(PYTHONPATH=src python -m pdrs.cli count schemas/permit.json)" = "4000"
          test "$(PYTHONPATH=src python -m pdrs.cli rank schemas/permit.json '[\"experimental\", 7, 13]')" = "3493"
          test "$(PYTHONPATH=src python -m pdrs.cli unrank schemas/permit.json 3493)" = '["experimental", 7, 13]'
      - name: Validate research assets
        run: python scripts/check_research_assets.py
