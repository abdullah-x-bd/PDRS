name: Reproducibility

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deterministic-results:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate deterministic benchmark
        run: python scripts/run_benchmarks.py --output /tmp/baseline_density.csv
      - name: Check committed result
        run: diff -u results/baseline_density.csv /tmp/baseline_density.csv
      - name: Upload generated result
        uses: actions/upload-artifact@v4
        with:
          name: baseline-density
          path: /tmp/baseline_density.csv
