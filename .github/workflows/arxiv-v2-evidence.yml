name: arXiv v2 phases 1-9

on:
  pull_request:
    paths:
      - "paper/arxiv_v2/**"
      - ".github/workflows/arxiv-v2-evidence.yml"
  push:
    branches: ["agent/arxiv-v2-phases-1-9"]
    paths:
      - "paper/arxiv_v2/**"
      - ".github/workflows/arxiv-v2-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arxiv-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: paper/arxiv_v2/requirements-lock.txt
      - name: Install pinned analysis environment
        run: python -m pip install -r paper/arxiv_v2/requirements-lock.txt
      - name: Run semantic unit tests
        working-directory: paper/arxiv_v2
        run: python -m unittest discover -s tests -v
      - name: Regenerate redesigned evidence and figures
        run: python paper/arxiv_v2/experiments/run_phase1_9.py
      - name: Verify declared invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('paper/arxiv_v2')
          summary = json.loads((root/'results/processed/phase_1_9_summary.json').read_text())
          semantic = summary['semantic']
          assert semantic['round_trip_failures'] == 0
          assert semantic['lowering_collisions'] == 0
          assert semantic['malformed_rejected'] == semantic['malformed_cases']
          assert semantic['unicode_canonicalization_same_hash'] is True
          assert summary['defect_experiment']['rows'] == 3600
          assert all(row['overlap'] == 0 for row in summary['distributed'])
          assert (root/'reproducibility/SHA256SUMS.csv').exists()
          print(json.dumps(summary, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: arxiv-v2-synthetic-evidence
          retention-days: 90
          path: |
            paper/arxiv_v2/results
            paper/arxiv_v2/figures
            paper/arxiv_v2/reproducibility/SHA256SUMS.csv

  paper-build:
    needs: synthetic-evidence
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
          cache: pip
          cache-dependency-path: paper/arxiv_v2/requirements-lock.txt
      - run: python -m pip install -r paper/arxiv_v2/requirements-lock.txt
      - name: Regenerate figures used by manuscript
        run: python paper/arxiv_v2/experiments/run_phase1_9.py
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends texlive-latex-base texlive-latex-extra texlive-fonts-recommended lmodern
      - name: Compile manuscript
        working-directory: paper/arxiv_v2/paper
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          bibtex main
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          pdflatex -interaction=nonstopmode -halt-on-error main.tex
          ! grep -q "Overfull \\hbox" main.log
          pdfinfo main.pdf | tee paper-metadata.txt
      - uses: actions/upload-artifact@v4
        with:
          name: pdrs-arxiv-v2-paper
          retention-days: 90
          path: |
            paper/arxiv_v2/paper/main.pdf
            paper/arxiv_v2/paper/main.tex
            paper/arxiv_v2/paper/references.bib
            paper/arxiv_v2/paper/paper-metadata.txt
            paper/arxiv_v2/figures

  extended-real-programs:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"
          cache: pip
      - name: Install PDRS and target dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r benchmarks/real_program/requirements.txt
      - name: Retrieve commit-pinned ISO 20022 schemas
        run: |
          mkdir -p benchmarks/real_program/vendor
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/sebastienrousseau/pacs008.github.io/2a35902f3ec7cdfe9f04c9d52743cea3e3d25630/static/schemas/pain.001.001.13.xsd \
            -o benchmarks/real_program/vendor/pain.001.001.13.xsd
          curl --fail --location --retry 3 \
            https://raw.githubusercontent.com/WojMam/xsdParserExample/5217c9a7fbb7d2d7154d86c182d184f43a116fac/src/main/resources/xsd/pacs.008.001.14.xsd \
            -o benchmarks/real_program/vendor/pacs.008.001.14.xsd
          sha256sum benchmarks/real_program/vendor/*.xsd | tee benchmarks/real_program/vendor/SHA256SUMS-v2.txt
      - name: Run extended real-program evaluation
        run: PYTHONPATH=src python paper/arxiv_v2/real_program/extended_evaluation.py benchmarks/real_program/vendor
      - name: Verify completion without promoting observations to defects
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('results/real_program_v2/summary.json').read_text())
          assert all(summary[name]['status'] == 'complete' for name in ('quantlib', 'simplefix', 'iso20022'))
          assert summary['quantlib']['boundary_cases'] == 12
          assert len(summary['simplefix']['valid_profiles']) == 4
          assert len(summary['iso20022']['valid_profiles']) == 2
          print(json.dumps(summary, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arxiv-v2-real-program-evidence
          retention-days: 90
          path: |
            results/real_program_v2
            benchmarks/real_program/vendor/SHA256SUMS-v2.txt
