name: Materialize complete evidence bundle

on:
  push:
    branches: ["agent/complete-evidence-suite"]
    paths:
      - ".bootstrap/**"
      - ".github/workflows/materialize.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Decode and extract evidence tree
        run: |
          cat .bootstrap/part.* | base64 --decode > /tmp/pdrs-evidence.tar.gz
          tar -xzf /tmp/pdrs-evidence.tar.gz
          rm -rf .bootstrap .github/workflows/materialize.yml
      - name: Commit materialized evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize complete PDRS evidence suite"
          git push origin HEAD:${GITHUB_REF_NAME}
