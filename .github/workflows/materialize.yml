name: Materialize complete evidence bundle

on:
  push:
    branches: ["agent/complete-evidence-suite"]
    paths:
      - ".bootstrap/**"
      - ".github/workflows/materialize.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Decode source bundle
        run: |
          cat .bootstrap/a00 .bootstrap/a01 .bootstrap/a02 .bootstrap/a03 .bootstrap/a04 | base64 --decode > /tmp/pdrs-source.tar.gz
          tar -xzf /tmp/pdrs-source.tar.gz
      - name: Install experiment dependencies
        run: python -m pip install -r requirements-experiments.txt
      - name: Run tests and independent proof checker
        run: |
          PYTHONPATH=src python -m unittest discover -s tests -v
          PYTHONPATH=src python scripts/verify_theorems.py --schemas 1000
      - name: Run full evidence suite
        run: |
          for stage in correctness density runtime uniformity fuzzing schema_evolution fault_propagation scalability_and_timing crypto_adapter; do
            PYTHONPATH=src python scripts/run_full_experiments.py --stage "$stage"
          done
          PYTHONPATH=src python scripts/derive_tables.py
          python scripts/assemble_evidence.py
          python scripts/verify_evidence.py
      - name: Remove bootstrap transport and commit evidence
        run: |
          rm -rf .bootstrap .github/workflows/materialize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Materialize complete PDRS evidence suite"
          git push origin HEAD:${GITHUB_REF_NAME}
