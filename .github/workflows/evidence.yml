name: Full evidence smoke

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-proof:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - if: matrix.python-version == '3.12'
        run: PYTHONPATH=src python scripts/verify_theorems.py --schemas 1000 --output /tmp/theorem_verification.json
      - if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: theorem-verification
          path: /tmp/theorem_verification.json

  experiment-stage:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stage:
          - correctness
          - density
          - runtime
          - uniformity
          - fuzzing
          - schema_evolution
          - fault_propagation
          - scalability_and_timing
          - crypto_adapter
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-experiments.txt
      - run: PYTHONPATH=src python scripts/run_full_experiments.py --stage "${{ matrix.stage }}" --quick
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.stage }}
          path: |
            results/raw
            results/processed
            results/figures

  committed-evidence-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/verify_evidence.py
