name: Materialize C and Rust evidence

on:
  push:
    branches: ["agent/native-c-rust-evidence"]
    paths:
      - ".native_bootstrap/**"
      - ".github/workflows/materialize-native.yml"
  pull_request:
    branches: [main]
    paths:
      - ".native_bootstrap/**"
      - ".github/workflows/materialize-native.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-native:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Decode native source bundle
        run: |
          cat .native_bootstrap/chunk00 .native_bootstrap/chunk01 | base64 --decode > /tmp/pdrs-native-source.tar.gz
          tar -xzf /tmp/pdrs-native-source.tar.gz
          test -f native/c/pdrs_native.c
          test -f native/rust/src/main.rs
          test -f scripts/native_evidence.py
      - name: Remove non-operational Rust metadata fields
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("native/rust/src/main.rs")
          source = path.read_text(encoding="utf-8")
          replacements = {
              '''enum Node {
              Terminal { name: String },
              Choice { name: String, field: String, branches: Vec<(String, usize)> },
              Range { name: String, field: String, start: i64, stop: i64, target: usize },
          }''': '''enum Node {
              Terminal,
              Choice { branches: Vec<(String, usize)> },
              Range { start: i64, stop: i64, target: usize },
          }''',
              '    version: String,\n': '',
              '    let version = version.ok_or_else(|| "missing schema version".to_string())?;': '    let _version = version.ok_or_else(|| "missing schema version".to_string())?;',
              '            RawNode::Terminal { name } => Node::Terminal { name },': '            RawNode::Terminal { .. } => Node::Terminal,',
              '            RawNode::Choice { name, field, branches } => {': '            RawNode::Choice { branches, .. } => {',
              '                Node::Choice { name, field, branches: resolved }': '                Node::Choice { branches: resolved }',
              '            RawNode::Range { name, field, start, stop, target } => {': '            RawNode::Range { start, stop, target, .. } => {',
              '                Node::Range { name, field, start, stop, target }': '                Node::Range { start, stop, target }',
              '    Ok(Schema { name, version, root, nodes, counts, max_depth })': '    Ok(Schema { name, root, nodes, counts, max_depth })',
              'Node::Terminal { .. }': 'Node::Terminal',
              'Node::Choice { branches, .. }': 'Node::Choice { branches }',
              'Node::Range { start, stop, target, .. }': 'Node::Range { start, stop, target }',
          }
          for old, new in replacements.items():
              if old not in source:
                  raise SystemExit(f"expected Rust source fragment missing: {old!r}")
              source = source.replace(old, new)
          path.write_text(source, encoding="utf-8")
          PY
          cargo fmt --manifest-path native/rust/Cargo.toml -- --check || cargo fmt --manifest-path native/rust/Cargo.toml
      - name: Install experiment dependencies
        run: python -m pip install -r requirements-experiments.txt
      - name: Generate canonical native IR
        run: PYTHONPATH=src python scripts/native_evidence.py prepare
      - name: Build and sanitize C
        run: |
          make -C native/c
          make -C native/c sanitize
          for ir in native/generated/irs/*.pdrs; do native/c/pdrs-c-sanitize verify "$ir"; done
      - name: Build and lint Rust
        run: |
          cargo clippy --manifest-path native/rust/Cargo.toml --all-targets -- -D warnings
          cargo build --release --manifest-path native/rust/Cargo.toml
      - name: Run native conformance and performance evidence
        run: |
          PYTHONPATH=src python scripts/native_evidence.py run \
            --c native/c/pdrs-c \
            --rust native/rust/target/release/pdrs-native \
            --iterations 200000
      - name: Assemble and verify expanded evidence
        run: |
          python scripts/assemble_evidence.py
          python scripts/verify_evidence.py
      - name: Commit materialized native evidence
        run: |
          rm -rf .native_bootstrap .github/workflows/materialize-native.yml
          rm -f native/c/pdrs-c native/c/pdrs-c-sanitize
          rm -rf native/rust/target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add independent C and Rust evidence"
          git push origin HEAD:${TARGET_BRANCH}
