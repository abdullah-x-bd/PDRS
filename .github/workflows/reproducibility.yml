name: Reproducibility

on:
  push:
    branches: [main, "agent/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  committed-evidence-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify committed checksums and critical invariants
        run: python scripts/verify_evidence.py
      - name: Upload processed evidence manifest
        uses: actions/upload-artifact@v4
        with:
          name: pdrs-evidence-manifest
          path: |
            results/processed/SHA256SUMS.csv
            results/processed/experiment_summary.json
            results/processed/SUMMARY.md
