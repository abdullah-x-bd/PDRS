name: Materialize C and Rust evidence

on:
  push:
    branches: ["agent/native-c-rust-evidence"]
    paths:
      - ".native_bootstrap/**"
      - ".github/workflows/materialize-native.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize-native:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-c-rust-evidence
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Decode native source bundle
        run: |
          cat .native_bootstrap/chunk00 .native_bootstrap/chunk01 | base64 --decode > /tmp/pdrs-native-source.tar.gz
          tar -xzf /tmp/pdrs-native-source.tar.gz
          test -f native/c/pdrs_native.c
          test -f native/rust/src/main.rs
          test -f scripts/native_evidence.py
      - name: Install experiment dependencies
        run: python -m pip install -r requirements-experiments.txt
      - name: Generate canonical native IR
        run: PYTHONPATH=src python scripts/native_evidence.py prepare
      - name: Build and sanitize C
        run: |
          make -C native/c
          make -C native/c sanitize
          for ir in native/generated/irs/*.pdrs; do native/c/pdrs-c-sanitize verify "$ir"; done
      - name: Build and lint Rust
        run: |
          cargo clippy --manifest-path native/rust/Cargo.toml --all-targets -- -D warnings
          cargo build --release --manifest-path native/rust/Cargo.toml
      - name: Run native conformance and performance evidence
        run: |
          PYTHONPATH=src python scripts/native_evidence.py run \
            --c native/c/pdrs-c \
            --rust native/rust/target/release/pdrs-native \
            --iterations 200000
      - name: Assemble and verify expanded evidence
        run: |
          python scripts/assemble_evidence.py
          python scripts/verify_evidence.py
      - name: Commit materialized native evidence
        run: |
          rm -rf .native_bootstrap .github/workflows/materialize-native.yml
          rm -f native/c/pdrs-c native/c/pdrs-c-sanitize
          rm -rf native/rust/target
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add independent C and Rust evidence"
          git push origin HEAD:agent/native-c-rust-evidence

# Triggered after the draft PR was opened so the generated evidence can be reviewed.
