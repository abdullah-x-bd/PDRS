name: Finalize FinSpace package

on:
  push:
    branches: ["agent/finspace-package"]
    paths:
      - ".github/workflows/materialize-finspace.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/finspace-package
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify the real package tree exists
        run: |
          test -f finspace/pyproject.toml
          test -d finspace/src/finspace
          test -d finspace/tests
          find finspace -maxdepth 4 -type f | sort
      - name: Install PDRS and complete FinSpace development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -e "./finspace[dev,all]"
      - name: Apply deterministic Ruff fixes
        run: |
          ruff check --fix --unsafe-fixes finspace/src finspace/tests finspace/examples
          ruff format finspace/src finspace/tests finspace/examples
          ruff check finspace/src finspace/tests finspace/examples
          ruff format --check finspace/src finspace/tests finspace/examples
      - name: Run tests with coverage
        run: python -m pytest finspace/tests --cov=finspace --cov-report=term-missing --cov-fail-under=85
      - name: Run adapters, CLI, and examples
        shell: bash
        run: |
          set -euo pipefail
          finspace --help
          finspace templates
          work=$(mktemp -d)
          examples=$(pwd)/finspace/examples
          cd "$work"
          for example in "$examples"/*.py; do
            echo "Running $(basename "$example")"
            python "$example"
          done
      - name: Build and reinstall wheel and source distribution
        run: |
          python -m build finspace
          ls -lh finspace/dist
          python -m pip uninstall -y finspace
          python -m pip install finspace/dist/*.whl
          python - <<'PY'
          import finspace
          from finspace.templates import european_options, market_risk
          assert european_options().compile().count > 0
          assert market_risk().compile().count > 0
          print("FinSpace wheel installed", finspace.__version__, finspace.__file__)
          PY
          rm -rf finspace/dist finspace/build finspace/*.egg-info finspace/src/*.egg-info
      - name: Remove obsolete bootstrap transport and markers
        run: |
          rm -rf .finspace-bootstrap .finspace-bootstrap-v2
          rm -f FINSPACE_STATUS.md finspace-placeholder.txt
      - name: Commit the validated package source and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git diff --cached --quiet && exit 0
          git commit -m "Finalize complete installable FinSpace package"
          git push origin HEAD:agent/finspace-package
